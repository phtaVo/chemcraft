<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lớp học - ChemCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ════════════════════════════════════════════════════════════
   CHEMCRAFT · Lớp học — Google Workspace design system
   (đồng bộ token với admin.html / teacher.html)
   ════════════════════════════════════════════════════════════ */
:root{
  --g-blue:#1a73e8;   --g-blue-hover:#1765cc;   --g-blue-container:#e8f0fe;   --g-blue-on:#174ea6;
  --g-red:#d93025;    --g-red-container:#fce8e6;    --g-red-on:#a50e0e;
  --g-yellow:#f9ab00; --g-yellow-hover:#e37400; --g-yellow-container:#feefc3; --g-yellow-on:#e37400;
  --g-green:#1e8e3e;  --g-green-container:#e6f4ea;  --g-green-on:#0d652d;
  --g-teal:#0b7f8e;   --g-teal-container:#e4f7f9;

  --indigo:var(--g-blue); --cyan:var(--g-teal);
  --n-10:#f8f9fa; --n-20:#f1f3f4; --n-30:#e8eaed; --n-40:#dadce0;
  --n-60:#9aa0a6; --n-70:#80868b; --n-80:#5f6368; --n-100:#202124;

  --sky:var(--n-10); --sky2:var(--n-20);
  --ink:var(--n-100); --text:var(--n-100); --text-m:var(--n-80); --text-l:var(--n-70);
  --border:var(--n-40); --border-soft:var(--n-30);
  --surface:#ffffff; --surface-2:var(--n-20); --surface-3:var(--n-30);
  --line-soft:var(--border-soft);

  --sh-2:0 1px 3px 0 rgba(60,64,67,.10), 0 4px 8px 0 rgba(60,64,67,.06);
  --sh-3:0 4px 8px 0 rgba(60,64,67,.10), 0 8px 24px 0 rgba(60,64,67,.08);
  --sh-4:0 8px 20px 0 rgba(60,64,67,.14), 0 12px 32px 0 rgba(60,64,67,.10);

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:9999px;

  --font-body:'Google Sans Text','Google Sans','Be Vietnam Pro',Roboto,-apple-system,sans-serif;
  --font-display:'Google Sans','Google Sans Text','Be Vietnam Pro',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--sky);color:var(--text);-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--n-40);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
.wrap{max-width:1100px;margin:0 auto;padding:32px 24px 60px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.title{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:500;font-size:1.5rem;color:var(--ink);letter-spacing:-.01em;}
.title i{width:36px;height:36px;border-radius:10px;background:var(--g-teal-container);color:var(--g-teal);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.btn{font-family:inherit;font-weight:500;font-size:.8125rem;padding:10px 20px;border:none;border-radius:var(--r-sm);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .12s,box-shadow .12s;}
.btn-primary{background:var(--g-blue);color:#fff;}
.btn-primary:hover{background:var(--g-blue-hover);box-shadow:var(--sh-2);}
.grade-tabs{display:inline-flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--r-pill);margin-bottom:22px;}
.grade-tab{padding:9px 22px;border-radius:var(--r-pill);background:transparent;font-weight:500;font-size:.8125rem;cursor:pointer;color:var(--text-m);transition:all .12s;}
.grade-tab:hover{color:var(--ink);}
.grade-tab.active{background:var(--surface);color:var(--g-blue-on);box-shadow:0 1px 2px rgba(60,64,67,.15);}
.section-label{font-family:var(--font-display);font-weight:500;font-size:1.0625rem;margin:26px 0 14px;color:var(--ink);letter-spacing:-.005em;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.class-card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line-soft);padding:18px;transition:border-color .15s,box-shadow .15s;cursor:pointer;}
.class-card:hover{border-color:var(--border);box-shadow:var(--sh-2);}
.class-name{font-family:var(--font-display);font-weight:500;font-size:1.0125rem;margin-bottom:5px;color:var(--ink);}
.class-meta{font-size:.8125rem;color:var(--text-m);margin-bottom:8px;}
.pill{display:inline-block;padding:3px 11px;border-radius:var(--r-pill);font-size:.6875rem;font-weight:500;background:var(--g-teal-container);color:var(--g-teal);}
.empty{text-align:center;padding:44px 20px;color:var(--text-l);font-size:.9rem;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(32,33,36,.5);z-index:999;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:min(420px,92vw);box-shadow:var(--sh-4);}
.modal h3{font-family:var(--font-display);font-weight:500;color:var(--ink);}
input{font-family:inherit;width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:.875rem;margin-bottom:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus{border-color:var(--g-blue);box-shadow:0 0 0 3px rgba(26,115,232,.15);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--n-100);color:#fff;padding:13px 20px;border-radius:var(--r-sm);font-size:.875rem;font-weight:500;z-index:1000;opacity:0;transform:translateY(10px);transition:.25s;box-shadow:var(--sh-3);}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title"><i class="fa-solid fa-chalkboard"></i> Lớp học</div>
    <button class="btn btn-primary" id="join-btn"><i class="fa-solid fa-right-to-bracket"></i> Tham gia bằng mã lớp</button>
  </div>

  <div class="section-label">Lớp học của tôi</div>
  <div class="grid" id="my-classes-grid"><div class="empty">Đang tải...</div></div>

  <div class="section-label" style="margin-top:30px;">Khám phá lớp học theo khối</div>
  <div class="grade-tabs">
    <div class="grade-tab active" data-grade="10">Lớp 10</div>
    <div class="grade-tab" data-grade="11">Lớp 11</div>
    <div class="grade-tab" data-grade="12">Lớp 12</div>
  </div>
  <div class="grid" id="browse-grid"><div class="empty">Đang tải...</div></div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal">
  <h3 style="margin-bottom:14px;">Tham gia lớp học</h3>
  <input id="join-code" placeholder="Nhập mã lớp, VD: CHEM10-AB3F9">
  <div style="display:flex;gap:10px;justify-content:flex-end;">
    <button class="btn" style="background:var(--sky2);color:var(--ink);" id="join-cancel">Huỷ</button>
    <button class="btn btn-primary" id="join-confirm">Tham gia</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

let firebaseConfig = {};
try { firebaseConfig = await (await fetch('/api/firebase-config')).json(); } catch(e){}
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let CURRENT_USER = null;

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

async function api(path, opts={}){
  const token = CURRENT_USER ? await CURRENT_USER.getIdToken() : null;
  const res = await fetch('/api/lms'+path, {
    method: opts.method||'GET',
    headers: {'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{})},
    body: opts.body?JSON.stringify(opts.body):undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error||'Đã có lỗi xảy ra.');
  return data;
}

async function loadMyClasses(){
  const grid = document.getElementById('my-classes-grid');
  try {
    const {classes} = await api('/classes/mine');
    grid.innerHTML = classes.length ? classes.map(c=>`
      <div class="class-card" onclick="location.href='class-detail.html?id=${c.id}'">
        <div class="class-name">${c.name}</div>
        <div class="class-meta">Khối ${c.grade} · ${(c.studentIds||[]).length} học sinh</div>
        <span class="pill">Đã tham gia</span>
      </div>`).join('') : '<div class="empty">Bạn chưa tham gia lớp học nào. Nhập mã lớp để tham gia.</div>';
  } catch(e){ grid.innerHTML = `<div class="empty">${e.message}</div>`; }
}

async function loadBrowse(grade){
  const grid = document.getElementById('browse-grid');
  grid.innerHTML = '<div class="empty">Đang tải...</div>';
  try {
    const {classes} = await api('/classes/browse?grade='+grade);
    grid.innerHTML = classes.length ? classes.map(c=>`
      <div class="class-card">
        <div class="class-name">${c.name}</div>
        <div class="class-meta">${c.description||''}</div>
        <div class="class-meta">${(c.studentIds||[]).length} học sinh</div>
        <button class="btn" style="background:var(--sky2);color:var(--ink);margin-top:6px;" onclick="window._joinDirect('${c.joinCode}')">Vào lớp học</button>
      </div>`).join('') : `<div class="empty">Chưa có lớp học nào ở Khối ${grade}.</div>`;
  } catch(e){ grid.innerHTML = `<div class="empty">${e.message}</div>`; }
}

document.querySelectorAll('.grade-tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.grade-tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  loadBrowse(t.dataset.grade);
}));

const modalBg = document.getElementById('modal-bg');
document.getElementById('join-btn').onclick = ()=> modalBg.classList.add('show');
document.getElementById('join-cancel').onclick = ()=> modalBg.classList.remove('show');
document.getElementById('join-confirm').onclick = async ()=>{
  const code = document.getElementById('join-code').value.trim();
  if (!code) return toast('Vui lòng nhập mã lớp.');
  try {
    await api('/classes/join', {method:'POST', body:{code}});
    modalBg.classList.remove('show');
    toast('Tham gia lớp học thành công!');
    loadMyClasses();
  } catch(e){ toast(e.message); }
};
window._joinDirect = async (code)=>{
  try { await api('/classes/join', {method:'POST', body:{code}}); toast('Tham gia lớp học thành công!'); loadMyClasses(); }
  catch(e){ toast(e.message); }
};

onAuthStateChanged(auth, async (user)=>{
  if (!user) { document.querySelector('.wrap').innerHTML = '<div class="empty">Vui lòng <a href="/">đăng nhập</a> để xem lớp học.</div>'; return; }
  CURRENT_USER = user;
  loadMyClasses();
  loadBrowse(10);
});
</script>
</body>
</html>
