<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết lớp học - ChemCraft</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --indigo:#4F6BFF; --cyan:#06B6D4; --gold:#F59E0B; --green:#10B981; --red:#EF4444;
  --sky:#F6F8FC; --sky2:#EEF2F9; --ink:#101725; --text:#1E2433; --text-m:#5B6477; --text-l:#8C95A8;
  --border:#E4E9F1; --sh-2:0 4px 14px rgba(16,23,37,0.08); --sh-3:0 12px 28px rgba(16,23,37,0.12);
  --r-md:12px; --r-lg:18px; --r-pill:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--sky);color:var(--text);}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px;}
.class-header{background:linear-gradient(135deg,#0B1220,#1B2A4A);border-radius:var(--r-lg);padding:26px;color:#fff;margin-bottom:20px;}
.class-header h1{font-size:1.4rem;font-weight:900;margin-bottom:6px;}
.class-header .meta{opacity:0.75;font-size:0.86rem;}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:9px 16px;border-radius:var(--r-pill);background:#fff;border:1.5px solid var(--border);font-weight:700;font-size:0.85rem;cursor:pointer;color:var(--text-m);}
.tab.active{background:linear-gradient(135deg,var(--indigo),var(--cyan));color:#fff;border-color:transparent;}
.card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-2);border:1px solid var(--border);padding:18px;margin-bottom:14px;}
.btn{font-family:inherit;font-weight:700;font-size:0.86rem;padding:9px 16px;border:none;border-radius:var(--r-pill);cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--cyan));color:#fff;}
.btn-ghost{background:var(--sky2);color:var(--ink);}
.pill{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:0.72rem;font-weight:700;}
.pill-live{background:#FDEDED;color:#C8312A;}
.pill-cyan{background:#E3F8FB;color:#0891A8;}
.pill-green{background:#E6F8F1;color:#0D9166;}
.empty{text-align:center;padding:34px;color:var(--text-l);}
textarea,input{font-family:inherit;width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:0.9rem;margin-bottom:10px;}
.chat-box{display:flex;flex-direction:column;height:280px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.chat-msgs{flex:1;overflow-y:auto;padding:10px;font-size:0.85rem;}
.chat-msg{margin-bottom:6px;}
.chat-input{display:flex;border-top:1px solid var(--border);}
.chat-input input{border:none;border-radius:0;margin:0;flex:1;}
.chat-input button{border:none;background:var(--indigo);color:#fff;padding:0 16px;cursor:pointer;}
.q-block{padding:14px 0;border-bottom:1px solid var(--border);}
.opt-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
.viewer-bg{display:none;position:fixed;inset:0;background:rgba(11,18,32,0.7);z-index:999;align-items:center;justify-content:center;padding:20px;}
.viewer-bg.show{display:flex;}
.viewer-box{background:#fff;border-radius:var(--r-md);width:min(900px,96vw);height:90vh;display:flex;flex-direction:column;overflow:hidden;}
.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
.viewer-head button{border:none;background:var(--sky2);border-radius:8px;padding:6px 10px;cursor:pointer;}
</style>

<div class="viewer-bg" id="viewer-bg">
  <div class="viewer-box">
    <div class="viewer-head"><b id="viewer-title">Xem tài liệu</b><button onclick="document.getElementById('viewer-bg').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button></div>
    <iframe id="viewer-iframe" style="flex:1;border:0;" src="about:blank"></iframe>
  </div>
</div>
</head>
<body>
<div class="wrap">
  <a href="classes.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-m);font-weight:700;font-size:0.86rem;text-decoration:none;margin-bottom:12px;">
    <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách lớp
  </a>
  <div id="header-area" class="class-header"><h1>Đang tải...</h1></div>
  <div class="tabs">
    <div class="tab active" data-tab="overview">Tổng quan</div>
    <div class="tab" data-tab="livestream">Livestream</div>
    <div class="tab" data-tab="documents">Tài liệu</div>
    <div class="tab" data-tab="lessons">Bài học</div>
    <div class="tab" data-tab="assignments">Bài tập</div>
    <div class="tab" data-tab="tests">Bài kiểm tra</div>
    <div class="tab" data-tab="chat">Chat với giáo viên</div>
  </div>
  <div id="content"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

let firebaseConfig = {};
try { firebaseConfig = await (await fetch('/api/firebase-config')).json(); } catch(e){}
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let CURRENT_USER = null;
const CLASS_ID = new URLSearchParams(location.search).get('id');
let CLASS_DATA = null;
let chatPollTimer = null;
let examTimer = null;

// ── Upload file lên Cloudinary (thay cho Firebase Storage — không cần
//    nâng cấp gói Blaze). "path" chỉ dùng để tạo folder cho gọn gàng,
//    không ảnh hưởng URL trả về.
const CLOUDINARY_CLOUD_NAME = 'kvq1twzz';
const CLOUDINARY_UPLOAD_PRESET = 'chemcraft_uploads';

async function uploadFile(file, path, onProgress){
  return new Promise((resolve, reject)=>{
    const folder = path.includes('/') ? path.substring(0, path.lastIndexOf('/')) : '';
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`);
    xhr.upload.onprogress = (e)=>{ if (onProgress && e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload = ()=>{
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch(e){}
      if (xhr.status >= 200 && xhr.status < 300 && data.secure_url) resolve(data.secure_url);
      else reject(new Error(data?.error?.message || 'Tải file lên thất bại.'));
    };
    xhr.onerror = ()=> reject(new Error('Lỗi mạng khi tải file lên.'));
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    if (folder) fd.append('folder', folder);
    xhr.send(fd);
  });
}
function safeFileName(name){ return name.replace(/[^a-zA-Z0-9_.\-]/g, '_'); }
const VIEWABLE_EXT = ['pdf','doc','docx','ppt','pptx'];
function isGoogleDocsLink(url){
  return /^https?:\/\/(docs|drive)\.google\.com\//.test(url || '');
}
function googleEmbedUrl(url){
  let m = url.match(/docs\.google\.com\/document\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://docs.google.com/document/d/${m[1]}/preview`;
  m = url.match(/docs\.google\.com\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://docs.google.com/spreadsheets/d/${m[1]}/preview`;
  m = url.match(/docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://docs.google.com/presentation/d/${m[1]}/embed`;
  m = url.match(/docs\.google\.com\/forms\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://docs.google.com/forms/d/${m[1]}/viewform?embedded=true`;
  m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return url;
}
function docViewerUrl(fileURL){
  return 'https://docs.google.com/viewer?url=' + encodeURIComponent(fileURL) + '&embedded=true';
}
function isViewableFile(fileURL, fileType){
  if (isGoogleDocsLink(fileURL)) return true;
  const ext = (fileType || fileURL.split('.').pop() || '').toLowerCase().replace('.', '');
  return VIEWABLE_EXT.includes(ext);
}
window.openViewer = function(title, fileURL, fileType){
  document.getElementById('viewer-title').textContent = title || 'Xem tài liệu';
  let src;
  if (isGoogleDocsLink(fileURL)) {
    src = googleEmbedUrl(fileURL);
  } else {
    const ext = (fileType || fileURL.split('.').pop() || '').toLowerCase().replace('.', '');
    src = ext === 'pdf' ? fileURL : docViewerUrl(fileURL);
  }
  document.getElementById('viewer-iframe').src = src;
  document.getElementById('viewer-bg').classList.add('show');
};

async function api(path, opts={}){
  const token = CURRENT_USER ? await CURRENT_USER.getIdToken() : null;
  const res = await fetch('/api/lms'+path, {
    method: opts.method||'GET',
    headers: {'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{})},
    body: opts.body?JSON.stringify(opts.body):undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error||'Đã có lỗi xảy ra.');
  return data;
}
function fmtDate(ts){ if(!ts) return '—'; return new Date(ts*1000).toLocaleString('vi-VN'); }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  clearInterval(chatPollTimer);
  renderTab(t.dataset.tab);
}));

async function renderTab(tab){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>';
  try {
    if (tab==='overview') return renderOverview();
    if (tab==='livestream') return renderLivestream();
    if (tab==='documents') return renderDocuments();
    if (tab==='lessons') return renderLessons();
    if (tab==='assignments') return renderAssignments();
    if (tab==='tests') return renderTests();
    if (tab==='chat') return renderTeacherChat();
  } catch(e){ el.innerHTML = `<div class="empty">${e.message}</div>`; }
}

async function renderOverview(){
  const el = document.getElementById('content');
  const [{lessons}, {assignments}] = await Promise.all([
    api(`/classes/${CLASS_ID}/lessons`), api(`/classes/${CLASS_ID}/assignments`),
  ]);
  const done = lessons.filter(l=>l.completed).length;
  const now = Date.now()/1000;
  const upcoming = assignments.filter(a=>a.deadline > now).sort((a,b)=>a.deadline-b.deadline).slice(0,3);
  el.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:10px;">Tiến độ học tập</h3>
      <div>Đã hoàn thành ${done}/${lessons.length} bài học</div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px;">Bài tập sắp đến hạn</h3>
      ${upcoming.length ? upcoming.map(a=>`
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
          <b>${a.title}</b><span class="pill pill-cyan">${fmtDate(a.deadline)}</span>
        </div>`).join('') : '<div class="empty">Không có bài tập nào sắp đến hạn.</div>'}
    </div>
  `;
}

async function renderLivestream(){
  const el = document.getElementById('content');
  const {livestreams} = await api(`/classes/${CLASS_ID}/livestreams`);
  const live = livestreams.find(l=>l.status==='live');
  const others = livestreams.filter(l=>l.id !== (live && live.id));
  el.innerHTML = `
    ${live ? `
      <div class="card">
        <div style="margin-bottom:10px;"><span class="pill pill-live">🔴 ĐANG TRỰC TIẾP</span> <b>${live.title}</b></div>
        <div style="aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;">
          <iframe src="${live.embedURL}" style="width:100%;height:100%;border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="chat-box">
          <div class="chat-msgs" id="chat-msgs"></div>
          <div class="chat-input"><input id="chat-input" placeholder="Nhập tin nhắn..."><button id="chat-send"><i class="fa-solid fa-paper-plane"></i></button></div>
        </div>
      </div>` : '<div class="card empty">Hiện không có buổi livestream nào đang diễn ra.</div>'}
    <div class="section-label" style="margin:16px 0 10px;font-weight:800;">Các buổi khác</div>
    ${others.length ? others.map(l=>`
      <div class="card">
        <b>${l.title}</b> ${l.status==='scheduled'?'<span class="pill pill-cyan">Sắp diễn ra</span>':'<span class="pill">Đã kết thúc</span>'}
        <div style="color:var(--text-m);font-size:0.82rem;margin-top:4px;">${fmtDate(l.scheduledAt)}</div>
        ${l.recordingURL ? `<a class="btn btn-ghost" style="margin-top:8px;display:inline-block;" href="${l.recordingURL}" target="_blank">Xem lại</a>` : ''}
      </div>`).join('') : '<div class="empty">Chưa có buổi nào khác.</div>'}
  `;
  if (live) {
    const loadChat = async ()=>{
      const {messages} = await api(`/livestreams/${live.id}/chat`);
      const box = document.getElementById('chat-msgs');
      if (!box) return;
      box.innerHTML = messages.map(m=>`<div class="chat-msg"><b>${m.name}:</b> ${m.message}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    };
    await loadChat();
    chatPollTimer = setInterval(loadChat, 4000);
    document.getElementById('chat-send').onclick = async ()=>{
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      try { await api(`/livestreams/${live.id}/chat`, {method:'POST', body:{message:msg}}); loadChat(); }
      catch(e){ alert(e.message); }
    };
  }
}

// Chat trực tiếp riêng tư với giáo viên chủ nhiệm lớp (khác chat livestream
// công khai ở trên) — tồn tại lâu dài, dùng để hỏi bài ngoài giờ học.
async function renderTeacherChat(){
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="card">
      <div class="chat-box" style="height:60vh;">
        <div class="chat-msgs" id="teacher-chat-msgs" style="flex:1;overflow-y:auto;"></div>
        <div class="chat-input"><input id="teacher-chat-input" placeholder="Nhập tin nhắn cho giáo viên..."><button id="teacher-chat-send"><i class="fa-solid fa-paper-plane"></i></button></div>
      </div>
    </div>`;
  const box = document.getElementById('teacher-chat-msgs');
  const loadChat = async ()=>{
    const {messages} = await api(`/classes/${CLASS_ID}/chat`);
    box.innerHTML = messages.length ? messages.map(m=>`
      <div class="chat-msg" style="margin-bottom:8px;${m.senderRole==='student'?'text-align:right;':''}">
        <div style="font-size:0.72rem;color:var(--text-l);margin-bottom:2px;">${m.senderRole==='teacher'?'Giáo viên':'Bạn'} · ${new Date(m.ts*1000).toLocaleString('vi-VN')}</div>
        <div style="display:inline-block;padding:8px 12px;border-radius:12px;background:${m.senderRole==='teacher'?'var(--sky2)':'linear-gradient(135deg,var(--indigo),var(--cyan))'};color:${m.senderRole==='teacher'?'var(--text)':'#fff'};max-width:80%;text-align:left;">${m.message}</div>
      </div>`).join('') : '<div class="empty">Chưa có tin nhắn nào. Hãy chào giáo viên của bạn!</div>';
    box.scrollTop = box.scrollHeight;
  };
  await loadChat();
  chatPollTimer = setInterval(loadChat, 4000);
  const send = async ()=>{
    const input = document.getElementById('teacher-chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    try { await api(`/classes/${CLASS_ID}/chat`, {method:'POST', body:{message:msg}}); loadChat(); }
    catch(e){ alert(e.message); }
  };
  document.getElementById('teacher-chat-send').onclick = send;
  document.getElementById('teacher-chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

async function renderDocuments(){
  const el = document.getElementById('content');
  const {documents} = await api(`/classes/${CLASS_ID}/documents`);
  el.innerHTML = documents.length ? documents.map((d,i)=>`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><b>${d.title}</b><div style="font-size:0.8rem;color:var(--text-m);">${d.fileType} · ${fmtDate(d.createdAt)}</div></div>
      <div style="display:flex;gap:8px;">
        ${isViewableFile(d.fileURL, d.fileType) ? `<button class="btn btn-primary view-doc" data-i="${i}">Xem trực tuyến</button>` : ''}
        <a class="btn btn-ghost" href="${d.fileURL}" target="_blank">Tải xuống</a>
      </div>
    </div>`).join('') : '<div class="card empty">Chưa có tài liệu nào.</div>';
  el.querySelectorAll('.view-doc').forEach(b=>b.onclick=()=>{
    const d = documents[parseInt(b.dataset.i,10)];
    openViewer(d.title, d.fileURL, d.fileType);
  });
}

async function renderLessons(){
  const el = document.getElementById('content');
  const {lessons} = await api(`/classes/${CLASS_ID}/lessons`);
  el.innerHTML = lessons.length ? lessons.map((l,li)=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${l.chapter ? l.chapter+' · ' : ''}${l.title}</b>
        ${l.completed ? '<span class="pill pill-green">Đã hoàn thành</span>' : `<button class="btn btn-ghost mark-done" data-id="${l.id}">Đánh dấu hoàn thành</button>`}
      </div>
      <div style="margin-top:10px;color:var(--text-m);font-size:0.9rem;white-space:pre-wrap;">${l.content||''}</div>
      ${(l.attachments||[]).length ? `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        ${l.attachments.map((a,ai)=>`<button class="btn btn-ghost btn-sm view-attach" data-li="${li}" data-ai="${ai}"><i class="fa-solid fa-paperclip"></i> ${a.name||('Tài liệu '+(ai+1))}</button>`).join('')}
      </div>` : ''}
    </div>`).join('') : '<div class="card empty">Chưa có bài học nào.</div>';
  el.querySelectorAll('.mark-done').forEach(b=>b.onclick=async()=>{ await api(`/lessons/${b.dataset.id}/complete`,{method:'POST'}); renderLessons(); });
  el.querySelectorAll('.view-attach').forEach(b=>b.onclick=()=>{
    const l = lessons[parseInt(b.dataset.li,10)];
    const a = l.attachments[parseInt(b.dataset.ai,10)];
    if (isViewableFile(a.url, a.type)) openViewer(a.name, a.url, a.type);
    else window.open(a.url, '_blank');
  });
}

async function renderAssignments(){
  const el = document.getElementById('content');
  const {assignments} = await api(`/classes/${CLASS_ID}/assignments`);
  const now = Date.now()/1000;
  const cards = await Promise.all(assignments.map(async (a,ai)=>{
    const {submission} = await api(`/assignments/${a.id}/my-submission`);
    const overdue = a.deadline && now > a.deadline;
    const files = (submission && submission.files) || [];
    const attachments = a.attachments || [];
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <b>${a.title}</b>
          ${submission ? (submission.status==='graded' ? `<span class="pill pill-green">Điểm: ${submission.score}/${a.maxScore}</span>` : '<span class="pill pill-cyan">Đã nộp</span>') : (overdue ? '<span class="pill" style="background:#FDEDED;color:#C8312A;">Quá hạn</span>' : '<span class="pill pill-cyan">Chưa nộp</span>')}
        </div>
        <div style="color:var(--text-m);font-size:0.85rem;margin:6px 0;">Hạn nộp: ${fmtDate(a.deadline)} · Điểm tối đa: ${a.maxScore}</div>
        <div style="margin:8px 0;white-space:pre-wrap;">${a.description||''}</div>
        ${attachments.length ? `<div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
          ${attachments.map((att,ati)=>`<button class="btn btn-ghost btn-sm view-a-attach" data-ai="${ai}" data-ati="${ati}"><i class="fa-solid fa-paperclip"></i> ${att.name||('Tài liệu '+(ati+1))}</button>`).join('')}
        </div>` : ''}
        ${(!overdue || submission) ? `
          <textarea id="ans-${a.id}" rows="3" placeholder="Nhập câu trả lời trực tiếp...">${submission ? (submission.content||'') : ''}</textarea>
          <div class="field"><label>Đính kèm file (ảnh bài làm / Word / PDF — có thể chọn nhiều)</label>
            <input type="file" id="file-${a.id}" multiple accept=".pdf,.doc,.docx,image/*">
          </div>
          <div class="field"><label>Hoặc dán link bài làm (Google Docs/Sheets/Slides/Drive — mỗi dòng 1 link)</label>
            <textarea id="link-${a.id}" rows="2" placeholder="https://docs.google.com/document/d/..."></textarea>
          </div>
          ${files.length ? `<div style="margin-bottom:8px;">Đã nộp: ${files.map(f=>`<a href="${f.url}" target="_blank">${f.name}</a>`).join(', ')}</div>` : ''}
          <div id="prog-${a.id}" class="hidden" style="height:6px;background:var(--sky2);border-radius:99px;overflow:hidden;margin-bottom:8px;"><div id="progbar-${a.id}" style="height:100%;width:0%;background:var(--indigo);"></div></div>
          <button class="btn btn-primary submit-a" data-id="${a.id}" ${overdue && !submission ? 'disabled' : ''}>Nộp bài</button>
        ` : ''}
      </div>`;
  }));
  el.innerHTML = cards.length ? cards.join('') : '<div class="card empty">Chưa có bài tập nào.</div>';
  el.querySelectorAll('.view-a-attach').forEach(b=>b.onclick=()=>{
    const a = assignments[parseInt(b.dataset.ai,10)];
    const att = a.attachments[parseInt(b.dataset.ati,10)];
    if (isViewableFile(att.url, att.type)) openViewer(att.name, att.url, att.type);
    else window.open(att.url, '_blank');
  });
  el.querySelectorAll('.submit-a').forEach(b=>b.onclick=async()=>{
    const aid = b.dataset.id;
    const content = document.getElementById('ans-'+aid).value;
    const fileInput = document.getElementById('file-'+aid);
    const newFiles = Array.from(fileInput.files || []);
    const linkLines = (document.getElementById('link-'+aid).value || '').split('\n').map(s=>s.trim()).filter(Boolean);
    const uploaded = [];
    try {
      if (newFiles.length) {
        const progWrap = document.getElementById('prog-'+aid);
        const progBar = document.getElementById('progbar-'+aid);
        progWrap.classList.remove('hidden');
        for (const file of newFiles) {
          const path = `lms/classes/${CLASS_ID}/submissions/${CURRENT_USER.uid}/${Date.now()}_${safeFileName(file.name)}`;
          const url = await uploadFile(file, path, (pct)=>{ progBar.style.width = pct+'%'; });
          uploaded.push({name: file.name, url});
        }
      }
      linkLines.forEach(url => uploaded.push({name: 'Link nộp bài', url}));
      await api(`/assignments/${aid}/submit`, {method:'POST', body:{content, files: uploaded}});
      alert('Đã nộp bài thành công!'); renderAssignments();
    } catch(e){ alert(e.message); }
  });
}

async function renderTests(){
  const el = document.getElementById('content');
  const {tests} = await api(`/classes/${CLASS_ID}/tests`);
  const {attempts} = await api('/my-test-attempts');
  el.innerHTML = tests.length ? tests.map(t=>{
    const attempt = attempts.find(a=>a.testId===t.id);
    const tl = t.settings && t.settings.timeLimitMinutes ? ' · ' + t.settings.timeLimitMinutes + ' phút' : '';
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <b>${t.title}</b>
          ${attempt ? `<span class="pill pill-green">${attempt.status==='graded'?`Điểm: ${attempt.totalScore}/${attempt.maxScore}`:'Chờ chấm tự luận'}</span>` : '<span class="pill pill-cyan">Chưa làm</span>'}
        </div>
        <div style="color:var(--text-m);font-size:0.85rem;margin:6px 0;">${(t.questions||[]).length} câu · Hạn: ${fmtDate(t.deadline)}${tl}</div>
        ${!attempt ? `<button class="btn btn-primary start-test" data-id="${t.id}">Làm bài</button>` : `<button class="btn btn-ghost review-test" data-id="${attempt.id}">Xem lại bài làm</button>`}
      </div>`;
  }).join('') : '<div class="card empty">Chưa có bài kiểm tra nào.</div>';
  el.querySelectorAll('.start-test').forEach(b=>b.onclick=()=> openTest(b.dataset.id));
  el.querySelectorAll('.review-test').forEach(b=>b.onclick=()=> reviewTestAttempt(b.dataset.id));
}

let EXAM = null;

function shuffleArray(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function openTest(testId){
  const {test} = await api(`/tests/${testId}`);
  const settings = test.settings || {};
  const groups = [
    {key:'multiple_choice', label:'Phần I: Trắc nghiệm'},
    {key:'true_false', label:'Phần II: Đúng/Sai'},
    {key:'true_false_group', label:'Phần II: Đúng/Sai'},
    {key:'short_answer', label:'Phần III: Trả lời ngắn'},
    {key:'essay', label:'Phần IV: Tự luận'},
  ];
  let order = [];
  const sectionRanges = [];
  groups.forEach(g=>{
    let idxs = test.questions.map((q,i)=>({q,i})).filter(x=>x.q.type===g.key).map(x=>x.i);
    if (!idxs.length) return;
    if (settings.shuffleQuestions) idxs = shuffleArray(idxs.slice());
    const last = sectionRanges[sectionRanges.length-1];
    if (last && last.label === g.label) { last.end = order.length + idxs.length; }
    else sectionRanges.push({label:g.label, start:order.length, end:order.length+idxs.length});
    order.push(...idxs);
  });
  const optionOrders = {};
  if (settings.shuffleOptions) {
    test.questions.forEach((q,i)=>{
      if (q.type === 'multiple_choice') optionOrders[i] = shuffleArray(q.options.map((_,oi)=>oi));
    });
  }
  EXAM = {
    testId, test, settings, order, sectionRanges, optionOrders,
    answers: {}, marked: new Set(), pos: 0,
    deadlineTs: settings.timeLimitMinutes ? Date.now() + settings.timeLimitMinutes*60000 : null,
  };
  renderExamShell();
  renderExamQuestion();
  if (EXAM.deadlineTs) startExamTimer();
}

function renderExamShell(){
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <b>${EXAM.test.title}</b>
      <div id="exam-timer" style="font-weight:800;${EXAM.deadlineTs?'':'display:none;'}"></div>
    </div>
    <div class="card">
      <div id="exam-palette" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;"></div>
      <div id="exam-question"></div>
      <div style="display:flex;justify-content:space-between;margin-top:14px;align-items:center;">
        <button class="btn btn-ghost" id="exam-prev">← Câu trước</button>
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="exam-mark" style="width:auto;"> Đánh dấu xem lại</label>
        <button class="btn btn-ghost" id="exam-next">Câu tiếp →</button>
      </div>
      <div style="margin-top:14px;text-align:right;">
        <button class="btn btn-primary" id="exam-submit">Nộp bài kiểm tra</button>
      </div>
    </div>
  `;
  document.getElementById('exam-prev').onclick = ()=> gotoExamPos(EXAM.pos-1);
  document.getElementById('exam-next').onclick = ()=> gotoExamPos(EXAM.pos+1);
  document.getElementById('exam-mark').onchange = (e)=>{
    const qi = EXAM.order[EXAM.pos];
    if (e.target.checked) EXAM.marked.add(qi); else EXAM.marked.delete(qi);
    renderExamPalette();
  };
  document.getElementById('exam-submit').onclick = ()=> submitExam(false);
}

function renderExamPalette(){
  const wrap = document.getElementById('exam-palette');
  wrap.innerHTML = EXAM.sectionRanges.map(sec=>{
    const btns = [];
    for (let p = sec.start; p < sec.end; p++) {
      const qi = EXAM.order[p];
      const answered = EXAM.answers[qi] !== undefined && EXAM.answers[qi] !== null && EXAM.answers[qi] !== '';
      const marked = EXAM.marked.has(qi);
      const isCurrent = p === EXAM.pos;
      const locked = (!EXAM.settings.allowReview && p < EXAM.pos);
      const bg = answered ? 'var(--green)' : 'var(--sky2)';
      const color = answered ? '#fff' : 'var(--text)';
      const border = marked ? 'var(--gold)' : (isCurrent ? 'var(--indigo)' : 'transparent');
      btns.push(`<button ${locked?'disabled':''} onclick="window._examGoto(${p})" style="width:34px;height:34px;border-radius:8px;border:2px solid ${border};background:${bg};color:${color};font-weight:700;cursor:${locked?'not-allowed':'pointer'};opacity:${locked?0.5:1};">${p+1}</button>`);
    }
    return `<div style="width:100%;font-size:0.78rem;font-weight:800;color:var(--text-m);margin:6px 0 2px;">${sec.label}</div><div style="display:flex;gap:6px;flex-wrap:wrap;">${btns.join('')}</div>`;
  }).join('');
}
window._examGoto = (p)=> gotoExamPos(p);

function gotoExamPos(p){
  if (!EXAM || p < 0 || p >= EXAM.order.length) return;
  if (!EXAM.settings.allowReview && p < EXAM.pos) return;
  saveCurrentAnswer();
  EXAM.pos = p;
  renderExamQuestion();
}

function saveCurrentAnswer(){
  const qi = EXAM.order[EXAM.pos];
  const q = EXAM.test.questions[qi];
  const root = document.getElementById('exam-question');
  if (!root) return;
  if (q.type === 'multiple_choice') {
    const checked = root.querySelector('input[name="eq"]:checked');
    EXAM.answers[qi] = checked ? parseInt(checked.value, 10) : null;
  } else if (q.type === 'true_false') {
    const checked = root.querySelector('input[name="eq"]:checked');
    EXAM.answers[qi] = checked ? checked.value === 'true' : null;
  } else if (q.type === 'true_false_group') {
    const vals = (q.subItems||[]).map((_,si)=>{
      const checked = root.querySelector(`input[name="eq-${si}"]:checked`);
      return checked ? checked.value === 'true' : null;
    });
    EXAM.answers[qi] = vals;
  } else {
    const inp = document.getElementById('eq-input');
    EXAM.answers[qi] = inp ? inp.value : null;
  }
}

function renderExamQuestion(){
  renderExamPalette();
  const qi = EXAM.order[EXAM.pos];
  const q = EXAM.test.questions[qi];
  const root = document.getElementById('exam-question');
  document.getElementById('exam-mark').checked = EXAM.marked.has(qi);
  document.getElementById('exam-prev').style.visibility = (EXAM.settings.allowReview && EXAM.pos > 0) ? 'visible' : 'hidden';
  document.getElementById('exam-next').textContent = EXAM.pos === EXAM.order.length-1 ? 'Câu cuối' : 'Câu tiếp →';

  let html = `<div style="font-weight:700;margin-bottom:4px;">Câu ${EXAM.pos+1}/${EXAM.order.length} (${q.points} điểm)</div><div style="white-space:pre-wrap;margin-bottom:12px;">${q.question}</div>`;
  const savedAns = EXAM.answers[qi];

  if (q.type === 'multiple_choice') {
    const optOrder = EXAM.optionOrders[qi] || q.options.map((_,i)=>i);
    html += optOrder.map(oi=>`<div class="opt-row"><label style="display:flex;gap:8px;cursor:pointer;width:100%;"><input type="radio" name="eq" value="${oi}" ${savedAns===oi?'checked':''}> ${q.options[oi]}</label></div>`).join('');
  } else if (q.type === 'true_false') {
    html += `<div class="opt-row"><label><input type="radio" name="eq" value="true" ${savedAns===true?'checked':''}> Đúng</label></div>
              <div class="opt-row"><label><input type="radio" name="eq" value="false" ${savedAns===false?'checked':''}> Sai</label></div>`;
  } else if (q.type === 'true_false_group') {
    html += (q.subItems||[]).map((si,sidx)=>{
      const val = Array.isArray(savedAns) ? savedAns[sidx] : null;
      return `<div style="margin:8px 0;padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="margin-bottom:6px;">${String.fromCharCode(97+sidx)}) ${si.text}</div>
        <div style="display:flex;gap:16px;">
          <label><input type="radio" name="eq-${sidx}" value="true" ${val===true?'checked':''}> Đúng</label>
          <label><input type="radio" name="eq-${sidx}" value="false" ${val===false?'checked':''}> Sai</label>
        </div></div>`;
    }).join('');
  } else if (q.type === 'short_answer') {
    html += `<input id="eq-input" placeholder="Nhập đáp án..." value="${savedAns||''}">`;
  } else {
    html += `<textarea id="eq-input" rows="5" placeholder="Viết câu trả lời của bạn...">${savedAns||''}</textarea>`;
  }
  root.innerHTML = html;
}

function startExamTimer(){
  const el = document.getElementById('exam-timer');
  const tick = ()=>{
    const remainMs = EXAM.deadlineTs - Date.now();
    if (remainMs <= 0) {
      clearInterval(examTimer);
      el.textContent = '00:00';
      if (EXAM.settings.autoSubmitOnTimeout) { alert('Hết thời gian làm bài — hệ thống tự động nộp bài.'); submitExam(true); }
      return;
    }
    const m = Math.floor(remainMs/60000), s = Math.floor((remainMs%60000)/1000);
    el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    el.style.color = remainMs < 60000 ? 'var(--red)' : 'var(--ink)';
  };
  tick();
  examTimer = setInterval(tick, 1000);
}

async function submitExam(isAuto){
  if (!isAuto && !confirm('Nộp bài kiểm tra? Bạn sẽ không thể sửa sau khi nộp.')) return;
  saveCurrentAnswer();
  clearInterval(examTimer);
  const answers = EXAM.test.questions.map((q,i)=> EXAM.answers[i] !== undefined ? EXAM.answers[i] : null);
  try {
    await api(`/tests/${EXAM.testId}/submit`, {method:'POST', body:{answers}});
    alert('Đã nộp bài kiểm tra!');
    EXAM = null;
    renderTests();
  } catch(e){ alert(e.message); }
}

async function reviewTestAttempt(attemptId){
  const {attempt} = await api(`/test-attempts/${attemptId}`);
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;">
        <b>${attempt.testTitle || 'Kết quả bài kiểm tra'}</b>
        <span class="pill pill-green">${attempt.totalScore}/${attempt.maxScore} điểm</span>
      </div>
      ${!attempt.revealAnswers ? '<div class="class-meta" style="margin-top:8px;">Giáo viên chưa công bố đáp án cho bài kiểm tra này.</div>' : ''}
    </div>
    ${attempt.questions.map((q,i)=>{
      const a = attempt.answers[i] || {};
      let body = `<div style="white-space:pre-wrap;margin:6px 0;"><b>Câu ${i+1}:</b> ${q.question}</div>`;
      if (attempt.revealAnswers) {
        if (q.type === 'multiple_choice') {
          body += q.options.map((o,oi)=>`<div class="opt-row" style="${oi===q.correctAnswer?'color:var(--green);font-weight:700;':''}${oi===a.answer && oi!==q.correctAnswer?'color:var(--red);':''}">${oi===q.correctAnswer?'✓':(oi===a.answer?'✗':'')} ${o}</div>`).join('');
        } else if (q.type === 'true_false_group') {
          body += (q.subItems||[]).map((si,sidx)=>{
            const given = Array.isArray(a.answer) ? a.answer[sidx] : null;
            const ok = given === si.correct;
            return `<div class="opt-row" style="${ok?'color:var(--green);':'color:var(--red);'}">${String.fromCharCode(97+sidx)}) ${si.text} — Đáp án đúng: ${si.correct?'Đúng':'Sai'}${given!==null?', bạn chọn: '+(given?'Đúng':'Sai'):''}</div>`;
          }).join('');
        } else if (q.type === 'short_answer') {
          body += `<div class="class-meta">Bạn trả lời: ${a.answer||'(trống)'} · Đáp án đúng: ${Array.isArray(q.correctAnswer)?q.correctAnswer.join(' / '):q.correctAnswer}</div>`;
        } else {
          body += `<div class="class-meta">Bạn trả lời:</div><div style="white-space:pre-wrap;">${a.answer||'(trống)'}</div>`;
        }
      }
      body += `<div class="class-meta" style="margin-top:6px;">Điểm: ${a.score != null ? a.score : 'chưa chấm'}/${q.points}</div>`;
      return `<div class="card">${body}</div>`;
    }).join('')}
    <button class="btn btn-ghost" onclick="renderTests()">← Quay lại danh sách</button>
  `;
}

onAuthStateChanged(auth, async (user)=>{
  if (!user) { document.querySelector('.wrap').innerHTML = '<div class="empty">Vui lòng <a href="/">đăng nhập</a> để xem lớp học.</div>'; return; }
  CURRENT_USER = user;
  if (!CLASS_ID) { document.querySelector('.wrap').innerHTML = '<div class="empty">Thiếu mã lớp học.</div>'; return; }
  try {
    const {class: cls} = await api(`/classes/${CLASS_ID}`);
    CLASS_DATA = cls;
    document.getElementById('header-area').innerHTML = `<h1>${cls.name}</h1><div class="meta">Khối ${cls.grade} · Mã lớp: ${cls.joinCode}</div>`;
    renderTab('overview');
  } catch(e){ document.querySelector('.wrap').innerHTML = `<div class="empty">${e.message}</div>`; }
});
